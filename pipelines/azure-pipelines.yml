trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'acr-connection'
  imageRepositoryBackend: 'agentic-backend'
  imageRepositoryFrontend: 'agentic-frontend'
  containerRegistry: 'myacr.azurecr.io'
  tag: '$(Build.BuildId)'

stages:
  - stage: LintAndTest
    displayName: Lint and Test
    jobs:
      - job: Backend
        displayName: Backend Lint & Test
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              cd apps/backend
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install ruff pytest-cov
              ruff check src/
              pytest --cov=src --cov-report=xml
            displayName: 'Run Ruff and Pytest'

      - job: Frontend
        displayName: Frontend Lint & Test
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              cd apps/frontend
              npm ci
              npm run lint
              npm run test -- --coverage --watchAll=false
            displayName: 'Run ESLint and Jest'

  - stage: SecurityScan
    displayName: Security Scan
    dependsOn: LintAndTest
    condition: succeeded()
    jobs:
      - job: Scan
        displayName: Trivy Image Scan
        steps:
          - task: Trivy@0
            inputs:
              type: 'fs'
              scanType: 'fs'
              scanPath: '$(Build.SourcesDirectory)'
              output: 'TRIVY-FS-REPORT.xml'
              format: 'xml'
          - task: Trivy@0
            inputs:
              type: 'image'
              scanType: 'image'
              imageRef: '$(containerRegistry)/$(imageRepositoryBackend):$(tag)'
              output: 'TRIVY-BACKEND-REPORT.xml'
              format: 'xml'

  - stage: Build
    displayName: Build and Push
    dependsOn: SecurityScan
    condition: succeeded()
    jobs:
      - job: Build
        displayName: Build
        steps:
          - task: Docker@2
            displayName: Build and Push Backend
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepositoryBackend)'
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/apps/backend/Dockerfile'
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: Build and Push Frontend
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepositoryFrontend)'
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/apps/frontend/host/Dockerfile'
              tags: |
                $(tag)
                latest

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'manifests'

  - stage: DeployStaging
    displayName: Deploy to Staging
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: Deploy
        displayName: Deploy to Staging
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: Kubernetes@1
                  displayName: 'Update Kubernetes Manifests'
                  inputs:
                    command: 'apply'
                    useConfigurationFile: true
                    configuration: '$(Pipeline.Workspace)/manifests/*.yaml'
                    namespace: 'agentic-platform-staging'

  - stage: DeployProd
    displayName: Deploy to Production
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        displayName: Deploy to Production
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: Kubernetes@1
                  displayName: 'Update Kubernetes Manifests'
                  inputs:
                    command: 'apply'
                    useConfigurationFile: true
                    configuration: '$(Pipeline.Workspace)/manifests/*.yaml'
                    namespace: 'agentic-platform'
