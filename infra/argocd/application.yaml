apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/agentic-platform.git'
    targetRevision: main
    path: infra/kubernetes
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: agentic-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
