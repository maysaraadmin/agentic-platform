replicaCount: 2
maxReplicas: 10

image:
  repository: myacr.azurecr.io/agentic-backend
  pullPolicy: Always
  tag: "latest"

postgres:
  host: postgres-service

rabbitmq:
  host: rabbitmq-service

hpa:
  cpu:
    targetAverageUtilization: 70

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
