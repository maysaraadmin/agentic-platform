global:
  environment: staging

postgres:
  enabled: true
  auth:
    existingSecret: postgres-secret
    secretKeys:
      adminPasswordKey: password

rabbitmq:
  enabled: true
  auth:
    existingSecret: rabbitmq-secret
    existingErlangSecretKey: erlang-cookie

backend:
  replicaCount: 1
  image:
    repository: myacr.azurecr.io/agentic-backend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: false
  env:
    - name: POSTGRES_HOST
      value: postgres
    - name: RABBITMQ_HOST
      value: rabbitmq
    - name: CORS_ORIGINS
      value: "https://staging.agentic.example.com"
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: backend-secrets
          key: secret-key
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

frontend:
  replicaCount: 1
  image:
    repository: myacr.azurecr.io/agentic-frontend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    - name: NX_API_URL
      value: "https://api.staging.agentic.example.com"

mfe-chat:
  enabled: true
  replicaCount: 1
  image:
    repository: myacr.azurecr.io/agentic-frontend
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

mfe-dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: myacr.azurecr.io/agentic-frontend
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
