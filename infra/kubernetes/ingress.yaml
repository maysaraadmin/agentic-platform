apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-platform-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.agentic-platform.example.com
        - app.agentic-platform.example.com
      secretName: agentic-platform-tls
  rules:
    - host: api.agentic-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
    - host: app.agentic-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
